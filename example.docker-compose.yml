services:
  newsnow:
    image: kayparavel/newsnow-kayparavel:latest
    container_name: newsnow
    ports:
      - '14444:4444'
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - G_CLIENT_ID=
      - G_CLIENT_SECRET=
      - JWT_SECRET=
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      - PRODUCTHUNT_API_TOKEN=
      # 代理配置（取消注释并修改为您的代理地址）
      - HTTP_PROXY=http://ip:port
      - HTTPS_PROXY=http://ip:port
      - PROXY=http://ip:port
      # 自动刷新（分钟），不设置或为0则不启用
      - CRON_INTERVAL=5
      # MySQL配置（可选，用于增量新闻同步）
      - MYSQL_HOST=
      - MYSQL_PORT=
      - MYSQL_USER=
      - MYSQL_PASSWORD=
      - MYSQL_NEWSOLD_DB=newsold
      - MYSQL_NEWSNOW_DB=newsnow
    restart: always

volumes:
  newsnow_data:
    name: newsnow_data
